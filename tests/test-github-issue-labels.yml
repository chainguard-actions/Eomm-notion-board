name: Test github-issue-labels input parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with github-issue-labels (comma-separated)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:octocat'
          github-issue-labels: 'bug,enhancement,help wanted'
          notion-token: 'secret_invalidtoken0000000000000000000000000000000'
          notion-database-id: 'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee'
          page-size: '10'
          log-level: 'debug'

      - name: Assert action failed at API level (labels were parsed without error)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because of the invalid Notion token (API error),
          # NOT because of label parsing. This confirms github-issue-labels input
          # is correctly parsed (split by comma, trimmed) without crashing.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Notion token"
            exit 1
          fi
          echo "PASS: action correctly parsed github-issue-labels and failed at Notion API"
