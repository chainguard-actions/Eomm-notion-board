name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:octocat'
          github-token: 'dummy-github-token'
          notion-token: 'dummy-notion-token'
          notion-database-id: 'dummy-database-id'
          delete-additional-rows: 'false'
          log-level: 'info'
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with dummy tokens (API auth errors)
          # but it must have started (not a configuration/input error)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with required inputs"
