name: Test with github-issue-labels filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:octocat'
          github-token: 'fake-github-token'
          notion-token: 'secret_fakefakefakefakefakefakefakefakefakefakefakefake'
          notion-database-id: 'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee'
          github-issue-labels: 'bug,enhancement'
          delete-additional-rows: 'false'
          log-level: 'info'

      - name: Assert action ran with issue labels filter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the tokens are invalid,
          # but it must not be 'skipped' (which would mean it never ran).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it did not run at all"
            exit 1
          fi
          # Acceptable outcomes: 'failure' (bad credentials) or 'success'
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with outcome=$OUTCOME and github-issue-labels set"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
