name: Test with issue labels filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:octocat'
          github-token: 'fake-github-token'
          notion-token: 'fake-notion-token'
          notion-database-id: 'fake-database-id'
          github-issue-labels: 'bug,enhancement'
          delete-additional-rows: 'false'
          log-level: 'info'
          page-size: '10'
      - name: Assert action ran with issue labels (may fail with invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with fake credentials.
          # We only verify it was invoked (outcome is set).
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action outcome is empty"
            exit 1
          fi
          echo "PASS: action was invoked with github-issue-labels and outcome=${{ steps.action.outcome }}"
