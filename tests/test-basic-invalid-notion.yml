name: Test basic usage with invalid Notion credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid Notion token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:actions'
          notion-token: 'secret_fakeinvalidtoken00000000000000000000000000'
          notion-database-id: 'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee'
          page-size: '10'
          log-level: 'debug'
          delete-additional-rows: 'false'

      - name: Assert action failed (Notion API rejection)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Notion credentials"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid Notion credentials"
