name: Test optional inputs (delete-additional-rows and page-size)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:octocat'
          github-token: 'fake-github-token'
          notion-token: 'fake-notion-token'
          notion-database-id: 'fake-database-id'
          delete-additional-rows: 'false'
          log-level: 'debug'
          page-size: '10'
      - name: Assert action ran (outcome is failure due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials and accepted optional inputs"
