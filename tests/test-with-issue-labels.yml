name: Test with issue labels filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:octocat'
          github-token: 'fake-github-token'
          notion-token: 'fake-notion-token'
          notion-database-id: 'fake-database-id'
          github-issue-labels: 'bug,enhancement'
          delete-additional-rows: 'false'
          log-level: 'debug'
          page-size: '10'
      - name: Assert action was invoked with issue labels
        run: |
          echo "Action completed (with expected failure due to fake credentials)"
          echo "PASS: action was invoked with github-issue-labels input"
