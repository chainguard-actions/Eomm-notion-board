name: Test page-size validation
on:
  workflow_dispatch:
jobs:
  test-page-size-too-low:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with page-size=0 (should fail with validation error)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:octocat'
          notion-token: 'fake-notion-token-for-validation-test'
          notion-database-id: 'fake-database-id-for-validation-test'
          page-size: '0'

      - name: Assert action failed due to page-size validation
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid page-size=0"
            exit 1
          fi
          echo "PASS: action correctly failed with page-size=0"

  test-page-size-too-high:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with page-size=101 (should fail with validation error)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:octocat'
          notion-token: 'fake-notion-token-for-validation-test'
          notion-database-id: 'fake-database-id-for-validation-test'
          page-size: '101'

      - name: Assert action failed due to page-size validation
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid page-size=101"
            exit 1
          fi
          echo "PASS: action correctly failed with page-size=101"
