name: Test page-size validation
on:
  workflow_dispatch:
jobs:
  test-page-size-too-low:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with page-size=0 (expect failure)
        id: action_low
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:actions'
          notion-token: 'fake-notion-token'
          notion-database-id: 'fake-database-id'
          page-size: '0'

      - name: Assert action failed due to invalid page-size
        run: |
          echo "outcome: ${{ steps.action_low.outcome }}"
          if [ "${{ steps.action_low.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid page-size=0"
            exit 1
          fi
          echo "PASS: action correctly failed with page-size=0"

  test-page-size-too-high:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with page-size=200 (expect failure)
        id: action_high
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:actions'
          notion-token: 'fake-notion-token'
          notion-database-id: 'fake-database-id'
          page-size: '200'

      - name: Assert action failed due to invalid page-size
        run: |
          echo "outcome: ${{ steps.action_high.outcome }}"
          if [ "${{ steps.action_high.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid page-size=200"
            exit 1
          fi
          echo "PASS: action correctly failed with page-size=200"
