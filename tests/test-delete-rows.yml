name: Test with delete-additional-rows enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with delete-additional-rows true (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'org:github'
          github-token: 'fake-github-token'
          notion-token: 'secret_fakefakefakefakefakefakefakefakefakefakefake'
          notion-database-id: 'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee'
          delete-additional-rows: 'true'
          log-level: 'debug'

      - name: Assert action ran (failed due to invalid credentials as expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran and succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
