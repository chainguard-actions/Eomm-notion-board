name: Test with delete-additional-rows enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-repository-query: 'user:octocat'
          github-token: ${{ github.token }}
          notion-token: 'secret_invalid_token_for_testing'
          notion-database-id: 'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee'
          delete-additional-rows: 'true'
          log-level: 'info'
          page-size: '10'

      - name: Assert action ran with delete-additional-rows enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected due to invalid credentials)"
